  <g fill="#152c3e" stroke="#30536a" stroke-width="1.5">
    <rect x="20" y="18" width="280" height="144" rx="8"/>
    <rect x="340" y="18" width="280" height="144" rx="8"/>
    <rect x="660" y="18" width="280" height="144" rx="8"/>
  </g>
  <g fill="none" stroke="#64d7c0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M309 90h21m-7-7 7 7-7 7"/>
    <path d="M629 90h21m-7-7 7 7-7 7"/>
    <path d="M160 39l20 8v16c0 14-20 24-20 24s-20-10-20-24V47z"/>
    <circle cx="480" cy="63" r="23"/>
