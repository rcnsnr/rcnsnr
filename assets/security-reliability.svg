    <text x="407.75" y="136" fill="#e6edf3" font-family="Arial,sans-serif" font-size="40" font-weight="700" text-anchor="start">VERIFY</text>
    <text x="701.08" y="136" fill="#e6edf3" font-family="Arial,sans-serif" font-size="40" font-weight="700" text-anchor="start">RECOVER</text>
  </g>
</svg>
